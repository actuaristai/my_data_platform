project:
  type: website
  output-dir: ./_site
  execute-dir: project

# tell quarto to read the generated sidebar
metadata-files:
  - docs/_sidebar.yml


quartodoc:
  package: my_data_platform
  sidebar: docs/_sidebar.yml
  sections:
    - title: Ingest
      desc: Download raw ATP/WTA CSVs from GitHub into data/01_raw/.
      contents:
        - ingest.main
        - ingest.download_tour_matches
        - ingest.download_tour_players
        - ingest.download_tour_rankings
    - title: Validate
      desc: Run pointblank validation checks across all layers.
      contents:
        - validate.main
    - title: Publish
      desc: Push gold tables to the pins board for downstream consumers.
      contents:
        - publish.main
        - publish.publish_gold_tables

website:
  navbar:
    background: primary
    search: true
    title: Docs
    left:
      - text: "Reference API"
        file: reference/index.qmd

